workflows:
  ios-unsigned:
    name: Build Unsigned iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build Flutter iOS without code signing
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned Runner into IPA format
        script: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r open_moi_cp_unsigned.ipa Payload
          mv open_moi_cp_unsigned.ipa ../../../
    artifacts:
      - open_moi_cp_unsigned.ipa
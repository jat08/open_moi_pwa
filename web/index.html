<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenMOI - Moment of Inertia measuring companion application for paddles and racquets.">

  <!-- Mobile & iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenMOI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Viewport settings for standalone PWA presentation -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EDF5FE">

  <!-- Favicon and Web App Manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>OpenMOI</title>

  <style>
    body {
      background-color: #EDF5FE;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    @media screen and (orientation: landscape) and (max-device-width: 900px) {
      body {
        max-width: 450px;
        margin: 0 auto;
        position: relative;
      }
    }
  </style>

  <script>
    window.addEventListener('load', function() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait-primary').catch(function() {});
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

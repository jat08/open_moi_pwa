<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenMOI - Moment of Inertia measuring companion application for paddles and racquets.">

  <!-- Mobile & iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OpenMOI WebApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Viewport settings for standalone PWA presentation -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EDF5FE">

  <!-- Favicon and Web App Manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>OpenMOI WebApp</title>

  <style>
    html, body {
      background-color: #EDF5FE;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    flutter-view, flt-glass-pane, flt-scene-host {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    @media screen and (orientation: landscape) and (max-device-width: 900px) {
      body {
        max-width: 450px;
        margin: 0 auto;
        position: relative;
      }
    }
  </style>

  <script>
    (function() {
      function requestMotion() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission()
            .then(function(state) {
              console.log('iOS Motion permission state: ' + state);
            })
            .catch(function(err) {
              console.error('iOS Motion permission error: ' + err);
            });
        }
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().catch(function() {});
        }
        window.removeEventListener('click', requestMotion, true);
        window.removeEventListener('touchstart', requestMotion, true);
      }
      window.addEventListener('click', requestMotion, true);
      window.addEventListener('touchstart', requestMotion, true);
    })();

    window.requestMotionPermission = function() {
      return new Promise(function(resolve) {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission().then(function(state) {
            resolve(state === 'granted');
          }).catch(function() {
            resolve(false);
          });
        } else {
          resolve(true);
        }
      });
    };

    window.addEventListener('scroll', function() {
      if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
      }
    }, { passive: false });

    window.addEventListener('load', function() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait-primary').catch(function() {});
      }
      if ('serviceWorker' in navigator) {
        var baseHref = document.querySelector('base') ? document.querySelector('base').getAttribute('href') : './';
        var swUrl = (baseHref.endsWith('/') ? baseHref : baseHref + '/') + 'sw.js?v=1.2.11';
        navigator.serviceWorker.register(swUrl, { scope: baseHref })
          .then(function(reg) {
            console.log('PWA Service Worker registered with scope: ', reg.scope);
          })
          .catch(function(err) {
            console.warn('PWA Service Worker registration failed: ', err);
          });
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
